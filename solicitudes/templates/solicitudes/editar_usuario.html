<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario - Vida Nueva</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/estilos_editar_usuario.css' %}">
</head>
<body>

<div class="container">

    <h1> Editar Usuario</h1>

    <form action="/actualizar_usuario/{{ admin.0 }}/" method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Nombre</label>
            <input type="text"
                   name="nombre"
                   value="{{ admin.1 }}"
                   required>
        </div>

        <div class="form-group">
            <label>Apellido</label>
            <input type="text"
                   name="apellido"
                   value="{{ admin.2 }}"
                   required>
        </div>

        <div class="form-group">
            <label>Cédula</label>
            <input type="text"
                   name="cedula"
                   value="{{ admin.3 }}"
                   required>
        </div>

        <div class="form-group">
            <label>Teléfono</label>
            <input type="text"
                   name="telefono"
                   value="{{ admin.4 }}"
                   required>
        </div>

        <div class="form-group">
            <label>Correo</label>
            <input type="email"
                   name="correo"
                   value="{{ admin.5 }}"
                   required>
        </div>

        <div class="form-group">
            <label>Usuario</label>
            <input type="text"
                   name="usuario"
                   value="{{ admin.6 }}"
                   required>
        </div>
        <div class="form-group">
            <label>Nueva Contraseña</label>
            <input type="password"
                   name="contraseña"
                   placeholder="Dejar vacío para mantener la actual">
        </div>

        <div class="form-group">
            <label>Rol</label>
            <select name="rol" required>
                <option value="superadmin"
                    {% if admin.7 == 'superadmin' %}selected{% endif %}>
                    👑 Superadministrador
                </option>

                <option value="secretaria"
                    {% if admin.7 == 'secretaria' %}selected{% endif %}>
                    📋 Secretaria
                </option>

                <option value="docente"
                    {% if admin.7 == 'docente' %}selected{% endif %}>
                    👨‍🏫 Docente
                </option>
            </select>
        </div>

        <div class="botones">
            <button type="submit" class="btn guardar">
                💾 Guardar Cambios
            </button>

            <a href="{% url 'dashboard_superadmin' %}" class="btn volver">
                ← Volver
            </a>
        </div>

    </form>

</div>

</body>
</html>
