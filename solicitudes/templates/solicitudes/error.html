<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0d2b08, #16410C, #16410C, #fcf75ec9, #fcf75e);
            font-family: 'Segoe UI', sans-serif;
            overflow: none; 
            padding: 40px 20px;
            position: relative;
        }

        /* Círculos flotantes animados de fondo (Igual al Login) */
        body::before {
            content: '';
            position: fixed;
            width: 400px; 
            height: 400px;
            background: rgba(252, 247, 94, 0.35);
            border-radius: 50%;
            top: -100px; 
            left: -100px;
            animation: floatBg 8s ease-in-out infinite;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            width: 300px; 
            height: 300px;
            background: #16410c7f;
            border-radius: 50%;
            bottom: -80px; 
            right: -80px;
            animation: floatBg 6s ease-in-out infinite reverse;
            z-index: 0;
        }

        @keyframes floatBg {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }

        /* Animación Fade In de entrada */
        @keyframes fadeInError {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Contenedor tipo Tarjeta de Cristal (Glassmorphism) */
        .error-container {
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 50px 35px 35px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            z-index: 1;
            animation: fadeInError 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Icono rebotando */
        .error-icon {
            font-size: 70px;
            margin-bottom: 15px;
            animation: bounce 2s infinite ease-in-out;
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.15));
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .error-code {
            font-size: 2rem;
            color: #fcf75e;
            font-weight: 800;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .error-message {
            font-size: 1.25rem;
            color: white;
            margin-bottom: 15px;
            font-weight: 600;
            line-height: 1.3;
        }

        .error-description {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Contenedor de los botones */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Botón Principal (Mostaza) */
        .error-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: #fcf75e;
            color: #16410C;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .error-button:hover {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(252,247,94,0.3);
        }

        /* Botón Secundario (Transparente/Blanco) */
        .error-button.secondary {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            font-weight: 600;
        }

        .error-button.secondary:hover {
            background: rgba(255,255,255,0.1);
            border-color: #fcf75e;
            color: #fcf75e;
            transform: translateY(-2px);
            box-shadow: none;
        }

        .error-details {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.4);
            line-height: 1.4;
        }

        /* Ajustes Responsivos */
        @media (max-width: 480px) {
            .error-container {
                width: 92%;
                padding: 40px 20px 25px;
            }
            .error-icon { font-size: 60px; }
            .error-code { font-size: 1.6rem; }
            .error-message { font-size: 1.1rem; }
            .error-button { padding: 12px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">⚠️</div>
        <div class="error-code">Error {{ status_code }}</div>
        <div class="error-message">{{ error_title }}</div>
        <div class="error-description">Algo ha salido mal. Por favor, intenta de nuevo más tarde o regresa al panel principal.</div>
        
        <div class="button-group">
            <a href="/" class="error-button">Volver al Inicio</a>
            <a href="javascript:history.back()" class="error-button secondary">Atrás</a>
        </div>

        <div class="error-details">
            <p>Si el problema persiste, contacte con el administrador del sistema institucional.</p>
        </div>
    </div>
</body>
</html>
